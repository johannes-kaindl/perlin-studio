# Publishes every push on `main` to Codeberg Pages.
# Site: https://jkaindl.codeberg.page/perlin-studio/
#
# No build step needed — the repo root IS the deployable site.
# No secret needed — Forgejo provides `forge.token` automatically and
# git-pages/action recognises it as authorised (wildcard-domain matching:
# repo name == path segment).
name: Deploy to Codeberg Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# On fast push sequences only the newest deploy runs. Older in-flight
# deploys get cancelled — avoids race conditions on Codeberg Pages.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: codeberg-tiny
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      # Syntax gate: parse every deployable script (external perlin*.js +
      # inline <script> in index.html/examples) without executing. Catches a
      # typo before it ships a blank page.
      - name: Syntax check
        run: node scripts/check-syntax.mjs

      # Math smoke tests gate the deploy. perlin.js has documented bug
      # classes (loop-endpoint float-rounding, Z/W axis swap) that look
      # visually normal until a loop stops closing — better to fail the
      # workflow than ship a broken animation.
      - name: Smoke test
        run: node scripts/smoke-test.js

      - name: Publish to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.event.repository.owner.username }}.codeberg.page/${{ forge.event.repository.name }}/
          token: ${{ forge.token }}
          source: .
