# Publisht jeden Push auf `main` an Codeberg Pages.
# Site: https://jkaindl.codeberg.page/perlin-studio/
#
# Kein Build-Step nötig — das Repo-Root IST die deploybare Site.
# Kein Secret nötig — Forgejo stellt `forge.token` automatisch bereit,
# und git-pages/action erkennt es als autorisiert (Wildcard-Domain-
# Matching: Repo-Name == Pfad-Segment).
name: Deploy to Codeberg Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: codeberg-tiny
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Publish to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.event.repository.owner.username }}.codeberg.page/${{ forge.event.repository.name }}/
          token: ${{ forge.token }}
          source: .
