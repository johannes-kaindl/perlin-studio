name: Bug report
about: Something isn't working as expected
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. Please keep the report as concrete as
        possible — the easier it is to reproduce, the faster the fix.

        **Security-relevant issues** don't belong here — see
        [`SECURITY.md`](https://git.jkaindl.de/jkaindl/perlin-studio/src/branch/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A short, precise description of the problem.
      placeholder: WebM export aborts after ~30 seconds with no error.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Which steps reliably trigger the bug?
      placeholder: |
        1. Opened the app at https://pages.jkaindl.de/perlin-studio/
        2. Selected the "Lava" preset
        3. Clicked "Export WebM", waited 60s
        4. Downloaded file is 0 bytes
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: A WebM at the full length gets downloaded.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - Web (live demo)
        - Web (local via index.html / python http.server)
        - WebM export
        - Other / not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: Safari 18.5, macOS 15.4
  - type: input
    id: preset
    attributes:
      label: Preset (if relevant)
      placeholder: Lava, Aurora, Caustics, …
  - type: textarea
    id: console
    attributes:
      label: Browser console / logs
      description: Errors from the DevTools console, if any.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I checked [existing issues](https://git.jkaindl.de/jkaindl/perlin-studio/issues) for duplicates.
          required: true
        - label: This is not a security issue (otherwise → SECURITY.md).
          required: true
