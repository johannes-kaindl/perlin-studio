name: Bug-Report
about: Etwas funktioniert nicht wie erwartet
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden. Bitte halte den Report so konkret wie möglich —
        je besser ich es reproduzieren kann, desto schneller geht der Fix.

        **Sicherheitsrelevante Probleme** bitte nicht hier — siehe
        [`SECURITY.md`](https://codeberg.org/jkaindl/perlin-studio/src/branch/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: Was ist passiert?
      description: Eine kurze, präzise Beschreibung des Problems.
      placeholder: WebM-Export bricht nach ~30 Sekunden ohne Fehlermeldung ab.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduktion
      description: Welche Schritte führen zuverlässig zum Fehler?
      placeholder: |
        1. App geöffnet auf https://jkaindl.codeberg.page/perlin-studio/
        2. Preset „Lava" ausgewählt
        3. „Export WebM" geklickt, 60s gewartet
        4. Download-Datei ist 0 Byte
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      placeholder: WebM mit voller Länge wird heruntergeladen.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Welche Oberfläche?
      options:
        - Web (Codeberg-Pages-Live-Demo)
        - Web (lokal via index.html / python http.server)
        - WebM-Export
        - Andere / weiß nicht
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: Safari 18.5, macOS 15.4
  - type: input
    id: preset
    attributes:
      label: Preset (falls relevant)
      placeholder: Lava, Aurora, Caustics, …
  - type: textarea
    id: console
    attributes:
      label: Browser-Konsole / Logs
      description: Fehler aus DevTools-Konsole, falls vorhanden.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Vorab-Checks
      options:
        - label: Ich habe in [bestehenden Issues](https://codeberg.org/jkaindl/perlin-studio/issues) nach Duplikaten geschaut.
          required: true
        - label: Es handelt sich nicht um ein Sicherheitsproblem (sonst → SECURITY.md).
          required: true
