name: Feature request
about: An idea for an improvement or a new feature
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Before you type — Perlin Studio is deliberately **lean** and has
        clear guardrails (see [`AGENTS.md`](https://git.jkaindl.de/jkaindl/perlin-studio/src/branch/main/AGENTS.md)):

        - **no** framework (React/Vue/Svelte)
        - **no** build step (Webpack/Vite/esbuild)
        - **no** backend service
        - **no** external dependencies

        If your proposal needs one of those it will likely be declined
        — but please file it anyway so we can talk about it.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's currently impossible or awkward?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you implement it? UI sketch, JSON preset, pseudocode — whatever helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other paths you considered?
  - type: dropdown
    id: scope
    attributes:
      label: What's affected?
      multiple: true
      options:
        - Renderer (perlin-studio.js)
        - Noise backend (perlin.js)
        - UI (index.html / styles.css)
        - Worker / performance
        - Presets / export
        - Documentation
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I checked [existing issues](https://git.jkaindl.de/jkaindl/perlin-studio/issues) for duplicates.
          required: true
        - label: I understand the architectural guardrails from AGENTS.md.
          required: true
