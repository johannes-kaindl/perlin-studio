name: PerlinLivePhoto
options:
  bundleIdPrefix: page.codeberg.jkaindl
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PerlinLivePhoto:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../macos/Sources/PerlinLiveWallpaper/NoiseShader.swift
      - path: ../macos/Sources/PerlinLiveWallpaper/Renderer.swift
      - path: ../macos/Sources/PerlinLiveWallpaper/GPUContext.swift
      - path: ../macos/Sources/PerlinLiveWallpaper/Preset.swift
      - path: ../macos/Sources/PerlinLiveWallpaper/PresetStore.swift
      - path: ../macos/Sources/PerlinLiveWallpaper/LivePhotoExporter.swift
      - path: ../macos/Sources/PerlinLiveWallpaper/LivePhotoExportOptions.swift
      - path: ../macos/Sources/PerlinLiveWallpaper/PhotoLibraryDelivery.swift
      - path: ../macos/Sources/PerlinLiveWallpaper/Resources/presets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: page.codeberg.jkaindl.PerlinLivePhoto
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: U9X7M39R56
        CODE_SIGN_STYLE: Automatic
